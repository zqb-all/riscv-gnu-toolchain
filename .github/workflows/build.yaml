name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: build
      baremetal-multilib: "rv32i-ilp32--c;rv32im-ilp32--c;rv32iac-ilp32--;rv32imac-ilp32--;rv32imafc-ilp32f-rv32imafdc-;rv64imac-lp64--;rv64imafdc-lp64d--;--cmodel;medany,large"

  test-sim:
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: sim
      os: '["ubuntu-24.04"]'
      mode: '["newlib"]'
      target: '["rv64gc-lp64d"]'
      sim: '["spike"]'

  build-multilib:
    if: ${{ false }} # Disable until multilib errors are triaged
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: multilib
      os: '["ubuntu-24.04"]'
      mode: '["newlib","linux"]'
      target: '["rv64gc-lp64d"]'

